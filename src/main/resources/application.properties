spring.application.name=rate-limiter-service
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s

# Global fallback
rate-limiter.default-capacity=10
rate-limiter.default-refill-rate=2.0
rate-limiter.fail-open=true

# Free tier
rate-limiter.clients.free.endpoints.payments.capacity=5
rate-limiter.clients.free.endpoints.payments.refill-rate=1.0

# Premium tier
rate-limiter.clients.premium.capacity=50
rate-limiter.clients.premium.refill-rate=5.0
rate-limiter.clients.premium.endpoints.payments.capacity=100
rate-limiter.clients.premium.endpoints.payments.refill-rate=10.0
rate-limiter.clients.premium.endpoints.notifications.capacity=10
rate-limiter.clients.premium.endpoints.notifications.refill-rate=1.0
