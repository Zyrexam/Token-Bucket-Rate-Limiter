spring.application.name=rate-limiter-service
spring.data.redis.host=localhost
spring.data.redis.port=6379

rate-limiter.default-capacity=10
rate-limiter.default-refill-rate=2.0
rate-limiter.fail-open=true

# Basic Client
rate-limiter.clients[basic-client].capacity=5
rate-limiter.clients[basic-client].refill-rate=1.0


# Premium client - payments endpoint
rate-limiter.clients.premium-client.endpoints./payments.capacity=100
rate-limiter.clients.premium-client.endpoints./payments.refill-rate=10.0

# Premium client - notifications endpoint
rate-limiter.clients.premium-client.endpoints./notifications.capacity=10
rate-limiter.clients.premium-client.endpoints./notifications.refill-rate=1.0